# Open-source datasets, benchmarks, and models, shown on the homepage (index.html)
# in this order. `category` picks the group: `lead` (Lead & Mentored
# Projects) or `community` (Community & Collaborative Work).
# `year` is the paper's year, shown once in the left column (venues carry no year). `pub` (a publications.yml id) makes `venue` link to
# that paper on publications.html. Download and star counts in `details` are typed
# by hand, so refresh them together with the CV. Optional `role` (Core Contributor, ...)
# appears after the venue; `type` (Dataset, Benchmark, Model) is kept for reference
# and not shown. Optional `venue2` / `pub2` add a second paper. Optional `bullet`
# states the contribution on its own line under the row.

- year: "2026"
  title: "CodecFake+"
  category: lead
  type: "Dataset"
  venue: "IEEE TASLP"
  pub: "chen2026codecfake"
  link: "https://huggingface.co/datasets/CodecFake/CodecFake_Plus_Dataset"
  link_label: "HF"
  details: "Codec-based deepfake speech dataset (31 codecs); 4.3K+ HF downloads"

- year: "2024"
