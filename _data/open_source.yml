# Open-source datasets, benchmarks, and models, shown on honors.html (the "Misc"
# page) in this order. `category` picks the group: `lead` (Lead & Mentored
# Projects) or `community` (Community & Collaborative Contributions).
# `year` is the paper's year. `pub` (a publications.yml id) makes `venue` link to
# that paper on publications.html. Download and star counts in `details` are typed
# by hand, so refresh them together with the CV. `role` (First Author, Mentor, ...)
# appears after the venue; `type` (Dataset, Benchmark, Model) appears in brackets
# before the title. Optional `venue2` / `pub2` add a second paper. Optional `bullet`
# states the contribution on its own line under the row.

- year: "2026"
  title: "CodecFake+"
  category: lead
  type: "Dataset"
  venue: "IEEE TASLP&nbsp;’26"
  pub: "chen2026codecfake"
  role: "First Author"
  link: "https://huggingface.co/datasets/CodecFake/CodecFake_Plus_Dataset"
  link_label: "HF"
  details: "Codec-based deepfake speech dataset (31 codecs); 4.3K+ HF downloads"

