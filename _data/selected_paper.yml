groups:
  - title: "Speech & Audio Language Models and Generation"
    title_short: "Speech & Audio LMs and Generation"  # shown instead of title on phones (<= 768px)
    papers:
      - chen2026llmagents     # Audio generation (tech report)
      - chen2026lalm          # Audio-language models & benchmarks (tech report)
      - lu2026desta25         # Audio-language models & benchmarks (journal)
      # Benchmarks are hidden here for the job search (model training comes first); both stay
      # in Open Source Contributions. Uncomment to restore.
      # - huang2025dynamic    # Audio-language models & benchmarks (ML/NLP venue)
      # - wu-etal-2024-codec  # Audio-language models & benchmarks (ML/NLP venue)
      - wu2024towards         # Overview, audio-language models & benchmarks (tech report)

  - title: "Retrieval and Agentic Large Language Models"
    title_short: "Retrieval & Agentic LLMs"
    papers:
      - chen2026metabench     # Benchmark harness optimization (tech report)
      - chou2026efficient
      - cyli2026codarag

