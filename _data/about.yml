bio: |
  Xuanjun is a Ph.D. candidate at [National Taiwan University (NTU)](https://www.ntu.edu.tw/english/), advised by [Hung-yi&nbsp;Lee](https://speech.ee.ntu.edu.tw/~hylee/index.php) and [Jyh-Shing&nbsp;Roger&nbsp;Jang](http://mirlab.org/jang/cv/cv.asp).
  His research explores the intersection of large language models and speech/audio processing, focusing on training and benchmarking foundation models for audio understanding and generation, alongside an active focus on harnessing retrieval and agentic LLMs.
  He has published 15 first/co-first peer-reviewed papers at venues such as COLM, TIST, TASLP, ICASSP, INTERSPEECH, ASRU, SLT<!-- Future list once published: (e.g., NeurIPS, ICML, ICLR, ACL, EMNLP, NAACL, COLM, TIST, TASLP, ICASSP, INTERSPEECH, ASLI) -->, with selected honors including <!-- Temporarily hidden until the official announcement: <span style="white-space: nowrap">:icon-google:&nbsp;[Google PhD Fellowship](https://research.google/programs-and-events/phd-fellowship/),</span> --> <span style="white-space: nowrap">:icon-nvidia:&nbsp;[NVIDIA Academic Grant](https://www.nvidia.com/en-us/industries/higher-education-research/academic-grant-program/),</span> <span style="white-space: nowrap">:icon-sps:&nbsp;[IEEE SPS Scholarship](https://signalprocessingsociety.org/newsletter/2025/11/congratulations-2025-sps-scholarship-recipients),</span> and a [Best&nbsp;Student&nbsp;Paper nomination](https://arxiv.org/abs/2506.07294) at IEEE ASRU 2025.
  <span class="bio-highlight">He is actively looking for a 2027 research internship</span>.

