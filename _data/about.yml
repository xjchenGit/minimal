bio: |
  Hello! I am a Ph.D. student at the EECS College, [National Taiwan University](https://www.ntu.edu.tw/english/), advised by Profs.&nbsp;<span class="bio-highlight">[Hung-yi&nbsp;Lee](https://speech.ee.ntu.edu.tw/~hylee/index.php)</span> and <span class="bio-highlight">[Jyh-Shing&nbsp;Roger&nbsp;Jang](http://mirlab.org/jang/cv/cv.asp)</span>.
  My research focuses on **Speech&nbsp;& Audio Processing** and **Large Language Models**, specifically audio understanding, audio generation, deepfake speech, and agentic LLMs. My work is supported by <!-- Temporarily hidden until Google's public announcement on 2026-11-12 (Google told the user; keep hidden until then); to unhide, delete only these comment markers and this note, then change the " and " right after the NVIDIA link to ", and " (-> "Google PhD Fellowship, NVIDIA Academic Grant, and IEEE SPS Scholarship", same order as the private CV): <span style="white-space: nowrap">:icon-google:&nbsp;[Google PhD Fellowship](https://research.google/programs-and-events/phd-fellowship/recipients/){: .bio-ul}</span>, --> <span style="white-space: nowrap">:icon-nvidia:&nbsp;[NVIDIA Academic Grant](https://www.nvidia.com/en-us/industries/higher-education-research/academic-grant-program/)</span> and <span style="white-space: nowrap">:icon-sps:&nbsp;[IEEE SPS<span style="white-space: normal"> Scholarship</span>](https://signalprocessingsociety.org/our-story/news-updates/2026/11/congratulations-2026-sps-scholarship-recipients)</span>.
  I have published over 20 peer-reviewed papers, **15 as first/co-first author**, across top ML/NLP (ICLR, ACL, COLM, TIST) and speech (TASLP, ICASSP, INTERSPEECH, etc.) venues. My research received the Best Paper Award at ROCLING&nbsp;2025 and Best Paper Nominations at IEEE ASRU 2025 and ISCSLP 2026.
