bio: |
  I am a Ph.D. candidate at [National Taiwan University (NTU)](https://www.ntu.edu.tw/english/), advised by [Jyh-Shing&nbsp;Roger&nbsp;Jang](http://mirlab.org/jang/cv/cv.asp) and [Hung-yi&nbsp;Lee](https://speech.ee.ntu.edu.tw/~hylee/index.php).
  My research explores the intersection of large language models and speech/audio processing, focusing on training and benchmarking foundation models for audio understanding and generation, alongside an active focus on harnessing retrieval and agentic LLMs.
  I have published 10+ first/co-first papers in top-tier venues (e.g., COLM, TASLP, TIST, ICASSP, INTERSPEECH, ASRU, SLT), with selected honors including <!-- Temporarily hidden until the official announcement: <span style="white-space: nowrap">:icon-google:&nbsp;[Google PhD Fellowship](https://research.google/programs-and-events/phd-fellowship/),</span> --> <span style="white-space: nowrap">:icon-nvidia:&nbsp;[NVIDIA Academic Grant](https://www.nvidia.com/en-us/industries/higher-education-research/academic-grant-program/),</span> <span style="white-space: nowrap">:icon-sps:&nbsp;[IEEE SPS Scholarship](https://signalprocessingsociety.org/newsletter/2025/11/congratulations-2025-sps-scholarship-recipients),</span> and a [Best Student Paper nomination](https://arxiv.org/abs/2506.07294) at ASRU 2025.
  Additionally, <span class="bio-highlight">I am actively looking for a 2027 research internship</span>.

