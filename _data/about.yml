bio: |
  I am a Ph.D. student at [National Taiwan University](https://www.ntu.edu.tw/english/), advised by Profs.&nbsp;<span class="bio-highlight">[<span style="white-space: nowrap">Hung-yi</span> Lee](https://speech.ee.ntu.edu.tw/~hylee/index.php)</span> and <span class="bio-highlight">[<span style="white-space: nowrap">Jyh-Shing</span> Roger Jang](http://mirlab.org/jang/cv/cv.asp)</span>.
  My research focuses on **Speech&nbsp;& Audio Processing** and **Large Language Models**, specifically audio under&shy;standing, audio generation, deepfakes, and agentic LLMs. My work is supported by <span class="no-hyphen" style="white-space: nowrap">:icon-stealth:&nbsp;Industry<span style="white-space: normal"> PhD Fellowship</span></span>, <span style="white-space: nowrap">:icon-nvidia:&nbsp;[NVIDIA<span style="white-space: normal"> Academic Grant</span>](https://www.nvidia.com/en-us/industries/higher-education-research/academic-grant-program/)</span>, and <span style="white-space: nowrap">:icon-sps:&nbsp;[IEEE SPS<span style="white-space: normal"> Scholarship</span>](https://signalprocessingsociety.org/our-story/news-updates/2026/11/congratulations-2026-sps-scholarship-recipients)</span>.
  I have published over 20 peer-reviewed papers across top-tier ML/NLP (<span class="no-hyphen">ICLR, ACL, COLM, TIST</span>) and speech (<span class="no-hyphen">TASLP, ICASSP, INTERSPEECH, ASRU, SLT</span>, etc.) venues, of which <strong>15 are first or co-first authored</strong>. My research received the <span class="no-hyphen">Best Paper Award at ROCLING&nbsp;2025 and Best Paper Nominations at IEEE ASRU 2025 and ISCSLP 2026</span>.
