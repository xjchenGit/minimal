bio: |
  I am a Ph.D. student at [National Taiwan University](https://www.ntu.edu.tw/english/), advised by Profs.&nbsp;<span class="bio-highlight">[Hung-yi&nbsp;Lee](https://speech.ee.ntu.edu.tw/~hylee/index.php)</span> and <span class="bio-highlight">[Jyh-Shing&nbsp;Roger&nbsp;Jang](http://mirlab.org/jang/cv/cv.asp)</span>.
  My research focuses on **Speech/Audio Processing** and **Large Language Models**, specifically audio understanding, generation, deepfakes, and agentic LLMs, with support from the <!-- Temporarily hidden until Google's public announcement on 2026-11-12 (Google told the user; keep hidden until then); to unhide, delete only these comment markers and this note (no other edits; list becomes Google, NVIDIA, IEEE SPS, CTCI): <span style="white-space: nowrap">:icon-google:&nbsp;[Google PhD Fellowship](https://research.google/programs-and-events/phd-fellowship/recipients/){: .bio-ul}</span>, --> :icon-nvidia:&nbsp;[NVIDIA Academic Grant](https://www.nvidia.com/en-us/industries/higher-education-research/academic-grant-program/){: .bio-ul}, <span style="white-space: nowrap">:icon-sps:&nbsp;[IEEE SPS Scholarship](https://signalprocessingsociety.org/our-story/news-updates/2026/11/congratulations-2026-sps-scholarship-recipients){: .bio-ul}</span>, and :icon-ctci:&nbsp;[CTCI Foundation Sci.&nbsp;&amp;&nbsp;Tech. Scholarship](https://www.ctci.org.tw/8831/8838/talent_en/ctci-scholarship_en/){: .bio-ul}.
  I have published over 20 peer-reviewed papers across top ML/NLP (ICLR, COLM, ACM TIST, ACL Findings) and speech (TASLP, ICASSP, INTERSPEECH, ASRU, SLT, etc.) venues. I am the **first/co-first author of 15 papers**, earning a **best paper award** at ROCLING&nbsp;2025 and nominations at IEEE ASRU&nbsp;2025 and ISCSLP&nbsp;2026.
