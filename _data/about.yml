bio: |
  I am a Ph.D. student at [National Taiwan University (NTU)](https://www.ntu.edu.tw/english/), advised by [Jyh-Shing&nbsp;Roger&nbsp;Jang](http://mirlab.org/jang/cv/cv.asp) and [Hung-yi&nbsp;Lee](https://speech.ee.ntu.edu.tw/~hylee/index.php).
  Prior to this, I earned my M.S. and B.S. in Computer Science from :icon-ntu:&nbsp;[NTU](https://www.ntu.edu.tw/english/) (2023) and :icon-ntust:&nbsp;[Taiwan Tech](https://www.ntust.edu.tw/index.php?Lang=en) (2020).
  My research focuses on large language models, spoken language models, speech generation, and deepfakes, with more than 10 first/co-first papers published in top-tier venues such as TASLP, TIST, COLM, ICASSP, INTERSPEECH, ASRU, and SLT.
  I have been fortunate to receive several research honors, highlighted by:

  - **Awards:** [Best Paper Award](https://aclanthology.org/2025.rocling-main.6/) at ROCLING 2025 and [Best Student Paper nomination](https://arxiv.org/abs/2506.07294) at ASRU 2025.
  - **Funding:** <!-- Temporarily hidden until the official announcement: :icon-google:&nbsp;[Google PhD Fellowship](https://research.google/programs-and-events/phd-fellowship/), --> :icon-nvidia:&nbsp;[NVIDIA Academic Grant](https://www.google.com), and :icon-sps:&nbsp;[IEEE Signal Processing Society Scholarship](https://www.google.com).

  Recently, I have been working on training and benchmarking models for audio understanding and generation,
  building on my earlier work across three main threads:
  leading research on retrieval and agentic LLMs ([MetaBench-Harness](https://arxiv.org/abs/2609.33411), [CodaRAG](https://arxiv.org/abs/2604.10426), [GDP-RAG](https://arxiv.org/abs/2606.22681));
  contributing to large audio-language models and benchmarks ([DeSTA 2.5-Audio](https://arxiv.org/abs/2507.02768), [Dynamic-SUPERB Phase-2](https://openreview.net/forum?id=s7lzZpAW7T), [Codec-SUPERB](https://aclanthology.org/2024.findings-acl.616/));
  and spearheading work on audio deepfakes ([SingGraph](https://www.isca-archive.org/interspeech_2024/chen24o_interspeech.html), [CodecFake+](https://arxiv.org/abs/2501.08238), [SASTNet](https://arxiv.org/abs/2506.07294)).
  I am always glad to explore potential collaborations with those who share similar research interests, and <span class="bio-highlight">I am actively looking for a research scientist internship position</span>.

