bio: |
  I am a Ph.D. candidate at [National Taiwan University](https://www.ntu.edu.tw/english/), advised by Profs.&nbsp;<span class="bio-highlight">[<span style="white-space: nowrap">Hung-yi</span> Lee](https://speech.ee.ntu.edu.tw/~hylee/index.php)</span> and <span class="bio-highlight">[<span style="white-space: nowrap">Jyh-Shing</span> Roger Jang](http://mirlab.org/jang/cv/cv.asp)</span>.
  My research focuses on **Speech&nbsp;& Audio Processing** and **Large Language Models**, specifically audio understanding, audio generation, agentic LLMs, and deepfakes.
  I have published <strong>15+ first/co-first papers</strong> in Speech and NLP (e.g., <span class="no-hyphen">COLM, TASLP, TIST, ICASSP, INTERSPEECH</span>) and am a core con&shy;trib&shy;utor to <span class="no-hyphen"><span style="white-space: nowrap">DeSTA2.5-Audio</span> (TASLP)</span> and <span class="no-hyphen">SUPERB</span> series (<span class="no-hyphen">ICLR, ACL</span>). I hold a <span style="white-space: nowrap">:icon-google:&nbsp;[Google<span style="white-space: normal"> PhD&nbsp;Fellowship</span>](https://research.google/programs-and-events/phd-fellowship/recipients/){: .bio-ul}</span> (<span class="no-hyphen">Machine Perception</span>), <span style="white-space: nowrap">:icon-nvidia:&nbsp;[NVIDIA<span style="white-space: normal"> Academic&nbsp;Grant</span>](https://www.nvidia.com/en-us/industries/higher-education-research/academic-grant-program/){: .bio-ul}</span>, and <span style="white-space: nowrap">:icon-sps:&nbsp;[IEEE<span style="white-space: normal"> SPS&nbsp;Scholarship</span>](https://signalprocessingsociety.org/our-story/news-updates/2026/11/congratulations-2026-sps-scholarship-recipients){: .bio-ul}</span>, plus an IEEE ASRU Best Student Paper Nomination and three Best/Outstanding Paper Awards.
