# Listed in chronological order (newest first). This is the order shown on
# honors.html. Items with `selected: true` appear on honors.html; items with a
# numeric `featured` rank also appear on the homepage (index.html), sorted by
# that rank. Items with `selected: false` are kept for reference only.
# `pub` (a publications.yml id) makes the title link to that paper on
# publications.html.
# `category` picks the group on honors.html: `research` (Research Honors and
# Fellowships), `academic` (Academic Honors and Scholarships) or `travel`
# (Conference Travel Grants).
# `category: homepage` = homepage-only summary row (featured, never on honors.html,
# whose groups only pick research / academic / travel).

- year: "2026"
  title: "Google PhD Fellowship"
  category: research
  # link = Google's official 2026 announcement (blog, Nov 12, 2026: 148 new fellows across 38 countries); it does not
  # break fellows down by area. 13 = the 2026 "Machine Perception" list on research.google/programs-and-events/phd-fellowship/recipients/
  details: 'Recognized as one of 13 <a href="https://blog.google/company-news/outreach-and-initiatives/google-org/phd-fellows-2026/">Google PhD Fellows</a> in Machine Perception worldwide'
  featured: 0
  selected: true

