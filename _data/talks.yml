# Homepage section "Media & Talks" (index.html, after Experience). Rendered by _includes/talks-list.html.
# One item per topic; each `lines` entry is one occasion, on its own indented grey bullet:
#   **<title>**
#      • <role> · <venue> and <venue>, <tail> · <links>                    <year>
# Each line has its own `year`, shown in the right column of that bullet.
# Venues within one line are joined with "and" (e.g. two outlets that ran the same story).
# Optional venue `hover` is the link's tooltip (title attribute); `aside` goes in parentheses after it;
# `tail` (", a short description") is added after that as written; `prefix` goes before the link, unlinked.
# Optional venue `links` (Slides, Video, ...) follow after " · " as blue "Name ›";
# links with `url: soon` show as one light italic "Slides & Video coming soon"; an empty `url` hides the slot.
# `pub` (a publications.yml id) links the title to its card on publications.html.
# `quoted: true` puts the title in quotation marks (not used).
# Items need `selected: true` to show. Media first (owner's choice, 2026-11-26), then talks newest first.

- title: "Meet the 2026 Google PhD Fellows"   # headline of the Google.org Blog post
  lines:
    - role: "Media Feature"
      year: "2026"
      venues:
