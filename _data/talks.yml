        - { event: "Synced", aside: "機器之心", tail: ", a leading Chinese AI media outlet; 41K+ reads", link: "https://mp.weixin.qq.com/s/FQj7uirwIrVstf7XNhZyhA" }   # WeChat count seen 2026-11-26 (41.2K reads); refresh by hand
